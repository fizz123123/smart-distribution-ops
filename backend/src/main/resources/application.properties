# Application
spring.application.name=smart-distribution-api
server.port=${SERVER_PORT:8080}

# Local Docker Compose
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop

# JPA
# Local development currently uses Hibernate schema update; replace this with an
# explicit schema management strategy before production deployment.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Taipei
spring.data.web.pageable.max-page-size=100

# Transaction isolation
# MySQL 預設 REPEATABLE READ：同一交易內的一般查詢會一直看到第一次查詢時的快照
# 庫存與預留是「先鎖定餘額列，再查詢預留加總」，必須看到其他交易剛提交的預留才不會超額預留，
# 所以改用 READ COMMITTED：每次查詢都讀取最新已提交的資料
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# Logging
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %magenta([traceId=%X{traceId:--}]) %red([%thread]) %yellow(%logger{36}) - %cyan(%msg%n)

# JWT
app.security.jwt.issuer=smart-distribution-api
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-expiration=12h

# CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Mail（Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Account
# 設定密碼信裡的連結指向前端頁面；首次設定與重設密碼共用同一頁
app.account.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.account.mail-from=${MAIL_USERNAME}
app.account.password-token-validity=24h
# 啟用中的帳號超過這個天數沒有登入或被啟用，每天凌晨自動停用
app.account.inactivity-days=90
app.account.inactivity-cron=0 0 3 * * *

# Async（寄信等背景工作）
# 執行緒池使用 Spring Boot 預設值；關閉應用程式時最多等 30 秒，讓排隊中的信寄完
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# env import
spring.config.import=optional:file:./.env[.properties]
