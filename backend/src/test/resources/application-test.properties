# Spring Boot disables Docker Compose during tests by default. Enable it for
# application-context integration tests so they use the project's MySQL service.
spring.docker.compose.skip.in-tests=false
spring.jpa.open-in-view=false

# Test-only JWT configuration. Production and local development still read
# the signing key from the JWT_SECRET environment variable.
app.security.jwt.issuer=smart-distribution-api-test
app.security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.jwt.access-token-expiration=12h
app.security.cors.allowed-origins=http://localhost:5173
